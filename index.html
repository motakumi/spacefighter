<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Fighter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="mobile-controls" aria-label="ゲーム操作">
    <button type="button" data-key="KeyA" aria-label="左へ移動">←</button>
    <button type="button" data-key="KeyD" aria-label="右へ移動">→</button>
    <button type="button" data-key="Space" aria-label="射撃">ショット</button>
    <button type="button" data-key="KeyJ" aria-label="チャージ">チャージ</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
